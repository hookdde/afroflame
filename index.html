<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Afro Flame · Authentic African Food · Düsseldorf</title>
<meta name="description" content="Afro Flame – Grill · Afro Fusion · Authentic Food. Westafrikanische Küche, hausgemacht mit Liebe zur Culture. Jetzt Tisch reservieren in Düsseldorf."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>/* ===================== AFRO FLAME — base ===================== */
:root{
  --bg:#0a0706;
  --bg-2:#0f0b09;
  --surface:#15100c;
  --surface-2:#1d1611;
  --line:rgba(180,40,10,.14);
  --line-strong:rgba(170,35,8,.32);
  --flame:#c8280a;
  --flame-2:#d83a10;
  --ember:#c85c18;
  --red:#a01808;
  --red-deep:#6a0e04;
  --gold:#b86c10;
  --cream:#f6ece0;
  --muted:#b7a290;
  --muted-2:#7c6c5e;
  --shadow-flame:0 0 0 1px rgba(160,30,5,.25), 0 18px 60px -20px rgba(140,15,0,.5);
  --maxw:1240px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:"Manrope",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.no-scroll{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--flame);color:#160b03}

.display{font-family:"Anton",sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:.92}
.eyebrow{font-family:"Manrope";font-weight:800;letter-spacing:.32em;text-transform:uppercase;font-size:.72rem;color:var(--flame)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.flame-text{
  background:linear-gradient(180deg,#d85030 0%,#b01c08 38%,#780c00 70%,#4a0800 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@supports not ((background-clip:text) or (-webkit-background-clip:text)){
  .flame-text{color:#ff7a18;background:none}
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:.55em;
  font-weight:800;font-size:1rem;letter-spacing:.01em;
  padding:.95em 1.6em;border-radius:999px;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, filter .25s;
  position:relative;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-flame{
  color:#f6ece0;
  background:linear-gradient(180deg,#d83a10,#9a1406 55%,#640e00);
  box-shadow:0 10px 34px -10px rgba(255,90,10,.8), inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-flame:hover{transform:translateY(-3px);box-shadow:0 18px 44px -12px rgba(255,90,10,.95), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{
  color:var(--cream);border:1.5px solid var(--line-strong);
  background:rgba(255,255,255,.02);backdrop-filter:blur(6px);
}
.btn-ghost:hover{border-color:var(--flame);color:#fff;transform:translateY(-2px)}

/* ---------- reveal on scroll ---------- */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
}

/* ---------- section frame ---------- */
.section{position:relative;padding:108px 0}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:46px}
.sec-title{font-size:clamp(2.6rem,6vw,5rem);color:var(--cream)}

/* ---------- chips / badges ---------- */
.tag{display:inline-flex;align-items:center;gap:.4em;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.32em .7em;border-radius:999px}
.tag-veg{color:#9ff0a8;background:rgba(60,200,90,.12);border:1px solid rgba(90,220,120,.32)}
.tag-spice{color:#ffb38a;background:rgba(255,90,20,.12);border:1px solid rgba(255,120,40,.3)}
.tag-halal{color:#ffd98a;background:rgba(246,166,35,.12);border:1px solid rgba(246,166,35,.32)}

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0c0908}
::-webkit-scrollbar-thumb{background:#3a2a1e;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--flame)}
/* ============ shared component styles ============ */
.spice{display:inline-flex;gap:1px;align-items:center}
.pep{color:#5a4636;display:inline-flex;line-height:0}
.pep.on{color:#ff6a13;filter:drop-shadow(0 0 4px rgba(255,90,10,.6))}
.stars{display:inline-flex;gap:2px;line-height:0}
.s-on{color:var(--gold);filter:drop-shadow(0 0 3px rgba(246,166,35,.5))}
.s-off{color:#3a2c20}

.foodph{
  position:relative;width:100%;overflow:hidden;
  background:
    repeating-linear-gradient(135deg, rgba(255,120,40,.07) 0 12px, rgba(255,120,40,.02) 12px 24px),
    radial-gradient(120% 120% at 30% 0%, #241912 0%, #160f0a 70%);
  border:1px solid var(--line);
  display:flex;align-items:flex-end;
}
.foodph::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(60% 80% at 80% 110%, rgba(255,90,10,.18), transparent 60%);
}
.foodph-label{
  position:relative;z-index:1;margin:10px;
  font-family:"Manrope";font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted-2);background:rgba(8,6,5,.5);padding:.3em .6em;border-radius:6px;
  border:1px solid rgba(255,255,255,.05);
}
.sec-sub{font-size:1.05rem;color:var(--muted);max-width:600px;line-height:1.55;margin:0}

/* ===================== NAV ===================== */
.nav{position:fixed;top:0;left:0;right:0;z-index:90;transition:background .35s, backdrop-filter .35s, border-color .35s;border-bottom:1px solid transparent}
.nav.is-scrolled{background:rgba(10,7,6,.82);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:20px;height:72px}
.nav-logo{height:42px;display:flex;align-items:center;flex:0 0 auto}
.nav-logo img{height:42px;width:auto;object-fit:contain;filter:drop-shadow(0 0 14px rgba(180,20,0,.8)) drop-shadow(0 0 30px rgba(140,10,0,.45))}
.nav-links{display:flex;gap:6px;margin-left:8px}
.nav-link{font-weight:700;font-size:.95rem;color:var(--cream);padding:.5em .9em;border-radius:999px;opacity:.82;transition:.2s}
.nav-link:hover{opacity:1;background:rgba(255,255,255,.05);color:#fff}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.lang{display:flex;align-items:center;gap:4px;font-weight:800;font-size:.85rem;color:var(--muted-2)}
.lang button{padding:.25em .35em;border-radius:6px;transition:.2s}
.lang button.on{color:var(--flame)}
.lang button:hover{color:var(--cream)}
.lang-div{opacity:.4}
.nav-cta{padding:.7em 1.2em;font-size:.92rem}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);flex-direction:column;align-items:center;justify-content:center;gap:5px;background:rgba(255,255,255,.03)}
.burger span{width:20px;height:2px;background:var(--cream);border-radius:2px;transition:.3s}
.burger.x span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.x span:nth-child(2){opacity:0}
.burger.x span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-sheet{position:fixed;top:72px;left:0;right:0;background:rgba(10,7,6,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:0 24px;max-height:0;overflow:hidden;transition:max-height .4s ease, padding .4s;z-index:89}
.nav-sheet.open{max-height:340px;padding:18px 24px 26px}
.sheet-link{text-align:left;font-weight:700;font-size:1.1rem;padding:.7em .2em;border-bottom:1px solid var(--line);color:var(--cream)}

/* ===================== HERO ===================== */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;padding:128px 0 168px}
.hero-glow{position:absolute;left:50%;bottom:-22%;width:140%;height:80%;transform:translateX(-50%);
  background:radial-gradient(50% 60% at 50% 100%, rgba(255,90,10,.42), rgba(255,60,5,.12) 45%, transparent 70%);
  filter:blur(8px);animation:glowPulse 9s ease-in-out infinite;pointer-events:none}
.hero-glow2{position:absolute;left:50%;bottom:-10%;width:70%;height:55%;transform:translateX(-50%);
  background:radial-gradient(50% 60% at 50% 100%, rgba(255,170,40,.3), transparent 65%);
  filter:blur(20px);animation:glowPulse 7s ease-in-out infinite reverse;pointer-events:none}
@keyframes glowPulse{0%,100%{opacity:.75;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
.hero-embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hero-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 30%, transparent 40%, rgba(8,5,4,.7) 100%)}
.hero-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}

.hero-eyebrow{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:.74rem;color:var(--ember);
  padding:.6em 1.2em;border:1px solid var(--line-strong);border-radius:999px;background:rgba(255,120,30,.06)}
.hero-eyebrow .spark{color:var(--flame);font-size:.7rem}

.hero-title{font-size:clamp(2.2rem,8vw,5.2rem);margin:0;display:block;line-height:.98}
.hero-title .line{display:block;white-space:nowrap}
.hero-title .glow{filter:drop-shadow(0 6px 30px rgba(255,90,10,.45))}
.hero-sub{max-width:660px;font-size:clamp(1.02rem,1.6vw,1.28rem);line-height:1.6;color:var(--muted);margin:6px 0 4px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn.lg{font-size:1.08rem;padding:1.05em 1.9em}

.hero-stats{display:flex;align-items:center;gap:22px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.hstat{display:flex;flex-direction:column;align-items:center;gap:7px}
.hstat-top{height:24px;display:flex;align-items:center}
.hstat-top b{font-weight:900}
.tag-halal-mark{font-family:"Anton";font-size:1.1rem;letter-spacing:.06em;color:var(--gold);border:1.5px solid rgba(246,166,35,.5);padding:.05em .5em;border-radius:6px}
.hstat-lbl{font-size:.82rem;color:var(--muted);font-weight:600}
.hstat-lbl b{color:var(--cream)}
.hstat-sep{width:1px;height:34px;background:var(--line-strong)}

/* entrance */
.h-rise{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1)}
.h-rise.in{opacity:1;transform:none}
.h-rise.d0{transition-delay:.05s}.h-rise.d1{transition-delay:.18s}.h-rise.d2{transition-delay:.30s}
.h-rise.d3{transition-delay:.46s}.h-rise.d4{transition-delay:.58s}.h-rise.d5{transition-delay:.70s}

/* dish strip */
.hero-strip{position:absolute;bottom:60px;left:0;right:0;z-index:2;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;background:rgba(255,120,30,.03)}
.strip-track{display:flex;width:max-content;animation:scrollX 50s linear infinite}
.strip-group{display:flex}
.strip-item{display:inline-flex;align-items:center;gap:14px;padding:0 34px;font-family:"Anton";font-size:1.5rem;letter-spacing:.04em;color:rgba(246,236,224,.55);white-space:nowrap}
.strip-flame{color:var(--flame);flex:0 0 auto}
@keyframes scrollX{to{transform:translateX(-50%)}}

.hero-scroll{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.7;transition:.3s}
.hero-scroll:hover{opacity:1;color:var(--flame)}
.mouse{width:22px;height:34px;border:2px solid currentColor;border-radius:12px;display:flex;justify-content:center;padding-top:5px}
.wheel{width:3px;height:7px;background:currentColor;border-radius:2px;animation:wheelMove 1.5s ease-in-out infinite}
@keyframes wheelMove{0%{opacity:0;transform:translateY(-3px)}40%{opacity:1}100%{opacity:0;transform:translateY(7px)}}

@media (max-width:860px){
  .hero-strip{display:none}
}
@media (max-height:820px){
  .hero{padding-bottom:84px}
  .hero-strip{display:none}
  .hero-scroll{display:none}
}
@media (prefers-reduced-motion:reduce){
  .hero-glow,.hero-glow2,.strip-track,.wheel{animation:none}
}
/* ===================== MENU ===================== */
.menu{background:linear-gradient(180deg,#0a0706 0%,#0d0907 100%);overflow:hidden}
.menu-bg{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 0%, rgba(255,90,10,.10), transparent 60%)}
.menu .wrap{position:relative;z-index:1}

.cat-tabs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.cat-tab{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 22px;border-radius:18px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--muted);position:relative;min-width:118px;transition:.28s cubic-bezier(.2,.8,.2,1)}
.cat-tab .cat-ic{color:var(--muted-2);transition:.28s}
.cat-tab .cat-lbl{font-weight:800;font-size:.92rem;color:var(--cream);transition:.28s}
.cat-tab .cat-count{position:absolute;top:9px;right:11px;font-size:.66rem;font-weight:800;color:var(--muted-2);background:rgba(255,255,255,.05);padding:.1em .5em;border-radius:999px}
.cat-tab:hover{transform:translateY(-3px);border-color:var(--line-strong)}
.cat-tab:hover .cat-ic{color:var(--flame)}
.cat-tab.on{border-color:transparent;background:linear-gradient(180deg, rgba(255,120,30,.22), rgba(255,90,10,.08));box-shadow:var(--shadow-flame)}
.cat-tab.on .cat-ic{color:var(--flame);filter:drop-shadow(0 0 8px rgba(255,90,10,.6))}
.cat-tab.on::after{content:"";position:absolute;inset:-1.5px;border-radius:18px;border:1.5px solid var(--flame);opacity:.6;pointer-events:none}

.filter-row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:36px}
.filter-chip{display:inline-flex;align-items:center;gap:6px;padding:.5em 1.05em;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:.9rem;color:var(--muted);transition:.22s}
.filter-chip:hover{color:var(--cream);border-color:var(--line-strong)}
.filter-chip.on{background:var(--flame);color:#f6ece0;border-color:transparent;box-shadow:0 6px 18px -6px rgba(255,90,10,.6)}
.fufu-note{display:inline-flex;align-items:center;gap:7px;color:var(--ember);font-size:.86rem;font-weight:700;margin-left:6px}
.fufu-note svg{color:var(--flame)}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.mcard{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s;
  opacity:0;animation:cardPop .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cardPop{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.mcard:hover{transform:translateY(-6px);border-color:var(--line-strong);box-shadow:0 22px 50px -24px rgba(0,0,0,.8)}
.mcard.sig{border-color:rgba(255,120,30,.4)}
.mcard.sig:hover{box-shadow:var(--shadow-flame)}
.mcard .foodph{border:none;border-bottom:1px solid var(--line);border-radius:0}
.sig-flag{position:absolute;top:12px;left:12px;z-index:3;display:inline-flex;align-items:center;gap:5px;
  font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#f6ece0;
  background:linear-gradient(180deg,#ffc24a,#ff7a16);padding:.35em .7em;border-radius:999px;box-shadow:0 0 18px 2px rgba(255,122,22,.85),0 0 38px 6px rgba(255,90,10,.45),0 4px 14px -4px rgba(255,90,10,.7)}
.mcard-body{padding:16px 18px 18px}
.mcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mcard-name{font-size:1.08rem;font-weight:800;margin:0;line-height:1.2;color:var(--cream)}
.mcard-price{font-family:"Anton";font-size:1.5rem;letter-spacing:.01em;white-space:nowrap}
.mcard-desc{margin:8px 0 14px;font-size:.92rem;line-height:1.5;color:var(--muted);text-wrap:pretty}
.mcard-tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag-spice{padding:.3em .55em}

.menu-cta{display:flex;justify-content:center;margin-top:48px}

/* ===================== REVIEWS ===================== */
.reviews{background:#0a0706;overflow:hidden;padding-bottom:120px}
.rev-headwrap{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:52px}
.rev-head{display:flex;flex-direction:column;gap:14px}
.rev-score{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 30px;border:1.5px solid var(--line-strong);border-radius:20px;background:var(--surface);box-shadow:var(--shadow-flame)}
.rev-score-num{font-family:"Anton";font-size:3.4rem;line-height:1}
.rev-score-lbl{font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.03em}

.rev-marquee{position:relative;display:flex;flex-direction:column;gap:20px}
.rev-row{display:flex;gap:20px;width:max-content;will-change:transform}
.rev-row.a{animation:revScroll 160s linear infinite}
.rev-row.b{animation:revScroll 185s linear infinite reverse}
.rev-marquee:hover .rev-row{animation-play-state:paused}
@keyframes revScroll{to{transform:translateX(-50%)}}
.rev-fade{position:absolute;top:0;bottom:0;width:12%;z-index:3;pointer-events:none}
.rev-fade.left{left:0;background:linear-gradient(90deg,#0a0706,transparent)}
.rev-fade.right{right:0;background:linear-gradient(270deg,#0a0706,transparent)}

.rcard{flex:0 0 340px;width:340px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.rcard-head{display:flex;align-items:center;gap:11px}
.ravatar{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:900;font-size:.9rem;color:#f6ece0;background:linear-gradient(135deg,#ffc24a,#ff6a13)}
.rmeta{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.rname{font-weight:800;font-size:.95rem;color:var(--cream)}
.rwhen{font-size:.76rem;color:var(--muted-2)}
.gmark{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:"Anton";font-size:1rem;color:#fff;background:conic-gradient(from -45deg,#4285F4,#34A853,#FBBC05,#EA4335,#4285F4);flex:0 0 auto}
.rtext{font-size:.96rem;line-height:1.55;color:var(--cream);margin:0;flex:1;text-wrap:pretty}
.rbars{display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.rbar{display:flex;align-items:center;gap:9px;font-size:.76rem}
.rbar-l{width:58px;color:var(--muted);font-weight:600}
.rbar-track{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.rbar-fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff7a16,#ffc24a)}
.rbar-v{width:24px;text-align:right;font-weight:800;color:var(--ember)}

@media (prefers-reduced-motion:reduce){
  .rev-row.a,.rev-row.b{animation:none}
  .rev-marquee{overflow-x:auto}
}
@media (max-width:680px){
  .rcard{flex-basis:280px;width:280px}
  .rev-score{align-self:flex-start}
}
/* ===================== RESERVATION ===================== */
.reserve{position:relative;background:linear-gradient(180deg,#0a0706,#100a07 60%,#0a0706);overflow:hidden}
.reserve-embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.reserve-glow{position:absolute;left:50%;top:0;width:90%;height:60%;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(50% 60% at 50% 0%, rgba(255,90,10,.16), transparent 65%)}
.reserve .wrap{position:relative;z-index:2}
.reserve.pulse .res-card{animation:resPulse 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes resPulse{0%{box-shadow:0 0 0 0 rgba(255,120,30,.0), var(--shadow-flame)}30%{box-shadow:0 0 0 6px rgba(255,120,30,.35), 0 0 60px rgba(255,90,10,.5)}100%{box-shadow:var(--shadow-flame)}}

.res-card{max-width:680px;margin:0 auto;background:linear-gradient(180deg,#17110d,#120d0a);border:1.5px solid var(--line-strong);border-radius:26px;overflow:hidden;box-shadow:var(--shadow-flame)}
.res-progress{height:4px;background:rgba(255,255,255,.06)}
.res-progress-bar{height:100%;background:linear-gradient(90deg,#ff6a13,#ffc24a);transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(255,90,10,.7)}

.res-steps-head{display:flex;padding:22px 26px 0;gap:8px}
.rstep-dot{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;color:var(--muted-2)}
.rstep-dot span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.95rem;border:2px solid var(--line-strong);background:var(--surface);transition:.3s}
.rstep-dot em{font-style:normal;font-size:.74rem;font-weight:700;letter-spacing:.03em}
.rstep-dot.on span{border-color:var(--flame);color:var(--flame);box-shadow:0 0 0 4px rgba(255,120,30,.15)}
.rstep-dot.on{color:var(--cream)}
.rstep-dot.done span{background:linear-gradient(180deg,#ffc24a,#ff6a13);border-color:transparent;color:#1a0a02}
.rstep-dot.done{color:var(--cream)}

.res-body{padding:26px 30px 6px;min-height:240px}
.res-pane{animation:paneIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes paneIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.res-q{display:flex;align-items:center;gap:10px;font-size:1.32rem;font-weight:800;margin:0 0 4px;color:var(--cream)}
.res-q svg{color:var(--flame)}
.res-qsub{color:var(--muted);font-size:.92rem;margin:0 0 16px;font-weight:600}
.res-qsub.mt{margin-top:22px}
.res-qsub svg{vertical-align:-2px;color:var(--flame)}

/* party */
.party-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.party-chip{aspect-ratio:1.1;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--cream);font-size:1.1rem;transition:.22s;display:grid;place-items:center}
.party-chip b{font-family:"Anton";font-size:1.5rem;font-weight:400}
.party-chip.more{font-size:.82rem;font-weight:800;color:var(--muted)}
.party-chip:hover{border-color:var(--flame);transform:translateY(-2px)}
.party-chip.on{background:linear-gradient(180deg, rgba(255,120,30,.25), rgba(255,90,10,.1));border-color:var(--flame);color:#fff;box-shadow:0 8px 22px -10px rgba(255,90,10,.7)}
.party-custom{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px}
.party-custom button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line-strong);font-size:1.5rem;color:var(--flame);background:var(--surface);transition:.2s}
.party-custom button:hover{background:var(--flame);color:#1a0a02}
.party-custom span{font-size:1.05rem;min-width:120px;text-align:center}
.party-custom b{font-family:"Anton";font-size:1.6rem;color:var(--ember)}

/* dates */
.date-rail{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.date-rail::-webkit-scrollbar{height:6px}
.date-chip{flex:0 0 auto;width:72px;padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:start;position:relative;transition:.2s}
.dc-wd{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dc-day{font-family:"Anton";font-size:1.5rem;line-height:1}
.dc-mo{font-size:.7rem;color:var(--muted-2);font-weight:700;text-transform:uppercase}
.date-chip:hover:not(.closed){border-color:var(--flame);transform:translateY(-2px)}
.date-chip.on{background:linear-gradient(180deg, rgba(255,120,30,.25), rgba(255,90,10,.1));border-color:var(--flame);color:#fff;box-shadow:0 8px 22px -10px rgba(255,90,10,.7)}
.date-chip.closed{opacity:.4;cursor:not-allowed}
.dc-closed{position:absolute;bottom:-2px;font-size:.54rem;font-weight:800;color:#e0350f;text-transform:uppercase;letter-spacing:.04em}

.res-hint{color:var(--muted-2);font-size:.9rem;font-style:italic;padding:8px 0}
.time-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px}
.time-chip{padding:.7em 0;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--cream);font-weight:800;font-size:.95rem;transition:.18s}
.time-chip:hover{border-color:var(--flame);transform:translateY(-2px)}
.time-chip.on{background:var(--flame);color:#f6ece0;border-color:transparent;box-shadow:0 6px 16px -6px rgba(255,90,10,.7)}

/* step3 */
.res-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.res-summary span{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--ember);background:rgba(255,120,30,.08);border:1px solid var(--line-strong);padding:.45em .8em;border-radius:999px}
.res-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res-field{display:flex;flex-direction:column;gap:6px}
.res-field span{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.03em}
.res-field input{padding:.85em 1em;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--cream);font-size:1rem;font-family:inherit;transition:.2s}
.res-field input::placeholder{color:var(--muted-2)}
.res-field input:focus{outline:none;border-color:var(--flame);box-shadow:0 0 0 3px rgba(255,120,30,.16)}
.res-field.err input{border-color:#e0350f;box-shadow:0 0 0 3px rgba(224,53,15,.16)}
.res-err-msg{color:#ff7a52;font-size:.85rem;font-weight:700;margin-top:12px}

.res-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 30px 26px}
.btn.dis{opacity:.4;cursor:not-allowed;filter:grayscale(.3)}

/* done */
.res-done{text-align:center;padding:14px 0 6px;animation:paneIn .5s}
.done-badge{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#f6ece0;background:linear-gradient(180deg,#ffc24a,#ff6a13);box-shadow:0 0 0 6px rgba(255,120,30,.15), 0 10px 30px -8px rgba(255,90,10,.8);animation:badgePop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes badgePop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.done-title{font-size:2.4rem;margin:0 0 8px}
.done-sub{color:var(--muted);font-size:1rem;max-width:420px;margin:0 auto 22px;line-height:1.5}
.done-card{max-width:380px;margin:0 auto 18px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;text-align:left}
.done-row{display:flex;align-items:center;gap:12px;font-size:.98rem;font-weight:600;color:var(--cream)}
.done-row svg{color:var(--flame);flex:0 0 auto}
.done-demo{font-size:.8rem;color:var(--muted-2);font-style:italic;margin:0 0 14px}
.done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.done-actions .btn{flex:1 1 auto;justify-content:center;max-width:200px;font-size:.88rem}

/* ===================== VISIT ===================== */
.visit{background:#0a0706;padding-bottom:0}
.visit-grid{display:grid;grid-template-columns:1fr 1.3fr;grid-template-rows:auto auto;gap:20px}
.visit-card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.hours-card{grid-row:span 2;padding:26px}
.vc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.vc-head h3{display:flex;align-items:center;gap:9px;font-size:1.2rem;font-weight:800;margin:0}
.vc-head h3 svg{color:var(--flame)}
.open-pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;padding:.4em .8em;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.open-pill .dot{width:8px;height:8px;border-radius:50%}
.open-pill.open{color:#9ff0a8;background:rgba(60,200,90,.12);border:1px solid rgba(90,220,120,.32)}
.open-pill.open .dot{background:#4cd964;box-shadow:0 0 8px #4cd964;animation:blink 1.6s infinite}
.open-pill.closed{color:#ff9a7a;background:rgba(255,90,20,.1);border:1px solid var(--line-strong)}
.open-pill.closed .dot{background:#e0350f}
@keyframes blink{50%{opacity:.4}}
.hours-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hours-list li{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:.98rem}
.hours-list li:last-child{border-bottom:none}
.hday{color:var(--cream);font-weight:600}
.hday em{font-style:normal;color:var(--flame);font-weight:800;font-size:.8rem;margin-left:4px}
.hval{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.hours-list li.today{background:rgba(255,120,30,.06);margin:0 -10px;padding-left:14px;padding-right:14px;border-radius:10px;border-bottom-color:transparent}
.hours-list li.today .hval{color:var(--ember)}
.hours-list li.off .hval{color:#e0350f;font-weight:700}

.map-card{display:flex;flex-direction:column}
.map-embed{position:relative;flex:1;min-height:220px;display:block;overflow:hidden}
.map-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(.5) invert(.92) hue-rotate(180deg) saturate(.7) brightness(.9);opacity:.92}
.map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);color:var(--flame);filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));animation:pinBob 2.2s ease-in-out infinite;pointer-events:none}
@keyframes pinBob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-118%)}}
.map-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 60%,rgba(8,5,4,.55))}
.map-info{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;flex-wrap:wrap}
.mi-left{display:flex;flex-direction:column;gap:4px}
.mi-left strong{font-size:1.05rem;color:var(--cream)}

.social-card{position:relative;grid-column:2;overflow:hidden;min-height:210px;display:flex}
.social-embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.7}
.social-inner{position:relative;z-index:1;padding:26px;display:flex;flex-direction:column;gap:16px;justify-content:center;width:100%;
  background:radial-gradient(80% 100% at 100% 0%, rgba(255,90,10,.12), transparent 60%)}
.social-title{font-size:1.8rem;margin:0}
.insta-btn{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:.7em 1.2em;border-radius:14px;border:1.5px solid var(--line-strong);font-weight:800;font-size:1.05rem;color:var(--cream);transition:.25s;
  background:rgba(255,255,255,.02)}
.insta-btn svg{color:var(--flame)}
.insta-btn:hover{border-color:var(--flame);transform:translateY(-2px);background:rgba(255,120,30,.08)}
.btn.full{justify-content:center}

/* ===================== FOOTER ===================== */
.footer{margin-top:96px;border-top:1px solid var(--line);background:#080605;padding:48px 0 28px}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.footer-brand{display:flex;align-items:center;gap:18px}
.footer-brand img{height:46px;width:auto;filter:drop-shadow(0 0 14px rgba(180,20,0,.8)) drop-shadow(0 0 30px rgba(140,10,0,.45))}
.footer-tag{font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.footer-meta{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.footer-meta a{color:var(--flame);font-weight:700}
.footer-made{font-weight:800;color:var(--cream)}
.footer-rights{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted-2)}

/* ===================== responsive ===================== */
@media (max-width:880px){
  .visit-grid{grid-template-columns:1fr}
  .hours-card{grid-row:auto}
  .social-card{grid-column:auto}
  .res-fields{grid-template-columns:1fr}
}
/* ═══════════════════════════════════════════════════════
   MOBILE FIRST — vollständiges responsive System
   Breakpoints: 760px (Tablet/Large Phone), 480px (Phone), 360px (Small)
   Prinzip: Jede Sektion füllt den Viewport, Schrift & Abstände skalieren
   fließend, alle Animationen bleiben erhalten.
═══════════════════════════════════════════════════════ */

  }

  }

  .filter-row{

    flex-wrap:nowrap !important;
    -webkit-overflow-scrolling:touch;
    padding-bottom:4px !important
  }
  .filter-chip{ flex:0 0 auto; padding:.28em .7em !important; font-size:.74rem !important }

  /* Karten: 1 Spalte, horizontal layout */
  .menu-grid{
    grid-template-columns:1fr !important;
    gap:7px !important
  }
  .mcard{
    display:flex !important;
    flex-direction:row !important;
    border-radius:12px !important
  }
  .mcard .mcard-img{
    flex:0 0 30% !important;

  }

  }

  .mcard-tags { gap:3px !important }
  .tag{ font-size:.58rem !important; padding:.16em .4em !important }
  .foodph{ min-height:0 !important }
  .sig-flag{ font-size:.52rem !important; top:5px !important; left:5px !important }
  .menu-cta{ margin-top:14px !important }

  /* ── REVIEWS ── */
  .reviews{ padding:16px 0 !important }
  .rev-headwrap{
    flex-direction:column !important;
    align-items:flex-start !important;
    gap:10px !important;
    margin-bottom:12px !important
  }

    gap:6px !important;

  .res-card{
    max-width:100% !important;
    border-radius:14px !important;
    margin:0 !important

  .res-progress{ height:3px !important }

  .res-fields{ gap:7px !important; grid-template-columns:1fr }

/* ═══════════ RESPONSIVE HARDENING (additiv – verändert den Look nicht) ═══════════ */

/* 1+2 — Seite füllt jede Breite, niemals ein horizontaler Scrollbalken.
   Vertikales Scrollen bleibt erlaubt. overflow-x:clip schneidet die
   absichtlich überlaufenden Lauftexte sauber ab, ohne position:sticky zu brechen. */
html, body{
  width:100%;
  max-width:100%;
}
html{min-height:100%;}
/* overflow-x nur am body kappen (wie im Original) – am <html> würde clip/hidden
   das vertikale Scrollen der Seite blockieren. */
body{overflow-x:hidden;}
main{display:block;width:100%;}

/* 4 — lange, ununterbrochene Wörter (E-Mail, URL, Gerichtnamen) sprengen
   nie mehr die Box, sondern brechen um. (Nur als Notbremse – normale
   kurze Wörter wie "Menü" bleiben unangetastet.) */
body{overflow-wrap:break-word;}

/* 5 — Medien passen sich immer an: nie breiter als der Container, nie verzerrt,
   nie abgeschnitten. (Logos behalten ihre fixe Höhe + auto-Breite.) */
img, svg, video, iframe{max-width:100%;}
.nav-logo img, .footer-brand img{
  object-fit:contain;
  max-height:100%;
  width:auto;
}

/* Flex-Kinder dürfen schrumpfen statt überzulaufen → verhindert Überlappungen,
   wenn der Platz eng wird (Name vs. Preis, Nav-Zeile, Footer, Karten-Köpfe). */
.footer-inner > *,
.map-info > *,
.mi-left,
.mcard-top,
.rmeta,
.res-summary,
.done-row{ min-width:0; }
/* Nav-Links nie umbrechen lassen (z. B. "Menü"). */
.nav-link, .nav-cta, .sheet-link{ white-space:nowrap; }

/* Gericht-Name darf bei Platzmangel umbrechen, statt den Preis zu überlappen. */
.mcard-name{ min-width:0; overflow-wrap:break-word; }
.mcard-top{ flex-wrap:wrap; }

/* Reservierungs-Felder: Eingaben nie breiter als ihre Spalte. */
.res-field, .res-field input{ min-width:0; max-width:100%; }
.res-field input{ width:100%; }

   Desktop: min-height 100svh, Inhalt zentriert
   Mobile: natürlicher Fluss, kein erzwungenes Viewport-Fill

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {if (e.isIntersecting) {el.classList.add('in');io.unobserve(el);}});
    }, { threshold: .12, rootMargin: "0px 0px -8% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}
function Reveal({ children, className = "", style, delay = 0, as = "div" }) {
  const ref = useReveal();
  const El = as;
  return <El ref={ref} className={"reveal " + className} style={{ transitionDelay: delay + "ms", ...style }}>{children}</El>;
}

/* ============ EMBER / FIRE CANVAS ============ */
function EmberCanvas({ density = 1, className }) {
  const ref = useRef(null);
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cv = ref.current;if (!cv) return;
    const ctx = cv.getContext('2d');
    let w,h,dpr,raf,parts = [],running = true;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = cv.parentElement.getBoundingClientRect();
      w = r.width;h = r.height;
      cv.width = w * dpr;cv.height = h * dpr;
      cv.style.width = w + 'px';cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    const COUNT = reduce ? 0 : Math.round(w / 30 * density);
    function spawn(initial) {
      return {
        x: Math.random() * w,
        y: initial ? Math.random() * h : h + 10,
        r: .6 + Math.random() * 2.4,
        vy: .10 + Math.random() * 0.40,
        vx: (Math.random() - .5) * .4,
        a: .25 + Math.random() * .6,
        hue: 18 + Math.random() * 26,
        life: 0, max: 350 + Math.random() * 450,
        flick: Math.random() * 6.28
      };
    }
    for (let i = 0; i < COUNT; i++) parts.push(spawn(true));
    function frame() {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        p.life++;
        p.y -= p.vy;
        p.x += p.vx + Math.sin(p.life * .03 + p.flick) * .35;
        const lifeRatio = p.life / p.max;
        const alpha = p.a * (1 - lifeRatio);
        if (p.y < -10 || p.life > p.max) {Object.assign(p, spawn(false));continue;}
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        grd.addColorStop(0, 'hsla(' + p.hue + ',100%,62%,' + alpha + ')');
        grd.addColorStop(.4, 'hsla(' + (p.hue - 6) + ',100%,50%,' + alpha * .5 + ')');
        grd.addColorStop(1, 'hsla(' + (p.hue - 10) + ',100%,45%,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, 6.28);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      raf = requestAnimationFrame(frame);
    }
    if (COUNT > 0) frame();
    const onR = () => size();
    window.addEventListener('resize', onR);
    const vis = () => {running = !document.hidden;if (running && COUNT > 0) frame();};
    document.addEventListener('visibilitychange', vis);
    return () => {running = false;cancelAnimationFrame(raf);window.removeEventListener('resize', onR);document.removeEventListener('visibilitychange', vis);};
  }, [density]);
  return <canvas ref={ref} className={className} aria-hidden="true" />;
}

/* ============ HERO ============ */
function Hero({ t, onReserve, scrollTo, lang }) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => {const id = requestAnimationFrame(() => setMounted(true));return () => cancelAnimationFrame(id);}, []);
  const HERO_SLIDES = [1, 2, 3];
  const [slide, setSlide] = useState(0);
  useEffect(() => {
    const tmr = setInterval(() => setSlide((s) => (s + 1) % HERO_SLIDES.length), 2000);
    return () => clearInterval(tmr);
  }, []);
  const cls = (n) => "h-rise " + (mounted ? "in" : "") + " d" + n;

  return (
    <section className="hero" id="top">
      {/* layered fire glow */}
      <div className="hero-glow" aria-hidden="true"></div>
      <div className="hero-glow2" aria-hidden="true"></div>
      <EmberCanvas className="hero-embers" density={1.1} />
      <div className="hero-vignette" aria-hidden="true"></div>

      <div className="wrap hero-inner">
        <div className="hero-row">
          <div className="hero-copy">
            <div className="hero-top">
            <div className={cls(0) + " hero-eyebrow"}>
              <span className="spark">✦</span>{t.hero.eyebrow}<span className="spark">✦</span>
            </div>

            <h1 className="hero-title display">
              <span className={cls(1) + " line"}>{t.hero.title1}</span>
              <span className={cls(2) + " line flame-text glow"}>{t.hero.title2}</span>
            </h1>

            <p className={cls(3) + " hero-sub"}>{t.hero.sub}</p>
            </div>
          </div>

          <div className={"hero-media h-rise " + (mounted ? "in" : "") + " d3"}>
            <div className="hero-slideshow">
              <span className="hero-video-tag">{lang === "en" ? "Gallery" : "Galerie"}</span>
              {HERO_SLIDES.map((n, i) =>
              <div className={"hslide " + (i === slide ? "on" : "")} key={n}>
                  <image-slot id={"af-hero-" + n} shape="rect"
                placeholder={(lang === "en" ? "Drop image " : "Bild ") + n}
                style={{ display: "block", width: "100%", height: "100%", margin: "0px", padding: "0px" }}></image-slot>
                </div>
              )}
              <div className="hslide-dots">
                {HERO_SLIDES.map((n, i) =>
                <button type="button" key={n} aria-label={"Bild " + n}
                className={"hdot " + (i === slide ? "on" : "")}
                onClick={() => setSlide(i)}></button>
                )}
              </div>
            </div>
          </div>
        </div>

        <div className="hero-bottom">
          <div className={cls(5) + " hero-stats"}>
            <div className="hstat">
              <div className="hstat-top"><Stars n={5} size={16} /></div>
              <div className="hstat-lbl"><b>{AF.INFO.rating}</b> · {t.hero.stat1}</div>
            </div>
            <span className="hstat-sep"></span>
            <div className="hstat">
              <div className="hstat-top tag-halal-mark">HALAL</div>
              <div className="hstat-lbl">{t.hero.stat2}</div>
            </div>
            <span className="hstat-sep"></span>
            <div className="hstat">
              <div className="hstat-top"><Icon.flame width="20" height="20" style={{ color: "var(--flame)" }} /></div>
              <div className="hstat-lbl">{t.hero.stat3}</div>
            </div>
          </div>

          <div className={cls(4) + " hero-cta"}>
            <button className="btn btn-flame lg" onClick={onReserve}>
              <Icon.flame width="22" height="22" className="resflame" />{t.hero.cta1}
            </button>
            <button className="btn btn-ghost lg" onClick={() => scrollTo('menu')}>
              {t.hero.cta2}<Icon.arrow width="18" height="18" className="arrow-glow" />
            </button>
          </div>
        </div>
      </div>

      </section>);

}
Object.assign(window, { Hero });
/* ============ MENU ============ */
function MenuSection({ t, scrollTo, onReserve }) {
  const cats = [
  { key: "sides", icon: "grill" },
  { key: "mains", icon: "plate" },
  { key: "fufu", icon: "flame" },
  { key: "chops", icon: "bowl" },
  { key: "drinks", icon: "cup" }];

  const [active, setActive] = useState("mains");
  const [filter, setFilter] = useState("all"); // all | veg | spicy
  const data = AF.MENU[active];

  let items = data.items;
  if (filter === "veg") items = items.filter((i) => i.veg);
  if (filter === "spicy") items = items.filter((i) => (i.spice || 0) >= 2);

  const note = active === "fufu" ? t._lang === "en" ? data.note_en : data.note_de : null;

  return (
    <section className="section menu" id="menu">
      <div className="menu-bg" aria-hidden="true"></div>
      <div className="wrap">
        <Reveal className="sec-head" style={{ alignItems: "center", textAlign: "center" }}>
          <span className="eyebrow">{t.menu.eyebrow}</span>
          <h2 className="sec-title display flame-text glow">{t.menu.title}</h2>
          <p className="sec-sub">{t.menu.sub}</p>
        </Reveal>

        {/* category tabs */}
        <Reveal className="cat-tabs" delay={60}>
          {cats.map((c) => {
            const I = Icon[c.icon];
            return (
              <button key={c.key}
              className={"cat-tab " + (active === c.key ? "on" : "")}
              onClick={() => {setActive(c.key);}}>
                <span className="cat-ic"><I width="22" height="22" /></span>
                <span className="cat-lbl">{t.menu.cats[c.key]}</span>
                <span className="cat-count">{AF.MENU[c.key].items.length}</span>
              </button>);

          })}
        </Reveal>

        {/* filter row */}
        <Reveal className="filter-row" delay={90}>
          {[["all", t.menu.filterAll], ["veg", t.menu.filterVeg], ["spicy", t.menu.filterSpicy]].map(([k, l]) =>
          <button key={k} className={"filter-chip " + (filter === k ? "on" : "")} onClick={() => setFilter(k)}>
              {k === "veg" && <Icon.leaf width="15" height="15" />}
              {k === "spicy" && <Icon.flame width="15" height="15" />}
              {l}
            </button>
          )}
          {note && <span className="fufu-note"><Icon.flame width="15" height="15" />{note}</span>}
        </Reveal>

        {/* items grid */}
        <div className="menu-grid" key={active + filter}>
          {items.map((it, idx) =>
          <article className={"mcard pop " + (it.signature ? "sig" : "")} style={{ animationDelay: idx * 45 + "ms" }} key={it.id}>
              {it.signature && <span className="sig-flag"><Icon.flame width="12" height="12" />{t.menu.signature}</span>}
              <div className="mcard-img">
                <image-slot id={"af-dish-" + it.id} shape="rect"
              placeholder={it.name}
              style={{ width: "100%", height: "100%", display: "block" }}></image-slot>
              </div>
              <div className="mcard-body">
                <div className="mcard-top">

function hoursForDate(d) {
  const key = DOW[d.getDay()];
  const row = AF.HOURS.find((h) => h.key === key);
  return row ? row.hours : null; // null = closed
}
function buildSlots(hoursStr) {
  if (!hoursStr) return [];
  const m = hoursStr.match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);
  if (!m) return [];
  let sh = +m[1],sm = +m[2],eh = +m[3],em = +m[4];
  const start = sh * 60 + sm,end = eh * 60 + em - 30;
  const out = [];
  for (let t = start; t <= end; t += 30) {
    const hh = String(Math.floor(t / 60)).padStart(2, '0');
    const mm = String(t % 60).padStart(2, '0');
    out.push(hh + ":" + mm);
  }
  return out;
}
function nextDays(n) {
  const out = [];const base = new Date();base.setHours(0, 0, 0, 0);
  for (let i = 0; i < n; i++) {const d = new Date(base);d.setDate(base.getDate() + i);out.push(d);}
  return out;
}

function isOpenNow() {
  const now = new Date();
  const key = DOW[now.getDay()];
  const row = AF.HOURS.find((h) => h.key === key);
  if (!row || !row.hours) return false;
  const m = row.hours.match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);
  if (!m) return false;
  const cur = now.getHours() * 60 + now.getMinutes();
  return cur >= +m[1] * 60 + +m[2] && cur <= +m[3] * 60 + +m[4];
}

/* ============ APP ============ */
function App() {
  const [lang, setLang] = useState(() => localStorage.getItem('af_lang') || 'de');
  useEffect(() => {localStorage.setItem('af_lang', lang);document.documentElement.lang = lang;}, [lang]);

  const t = { ...AF.T[lang], _lang: lang };
  const openRef = useRef(null);
  const registerOpen = useCallback((fn) => {openRef.current = fn;}, []);
  const onReserve = () => {if (openRef.current) openRef.current();};

  const scrollTo = (id) => {
    if (id === 'top') {window.scrollTo({ top: 0, behavior: 'smooth' });return;}
    const el = document.getElementById(id);
    if (el) {const y = el.getBoundingClientRect().top + window.scrollY - 64;window.scrollTo({ top: y, behavior: 'smooth' });}
  };

  return (
    <React.Fragment>
      <Nav lang={lang} setLang={setLang} t={t} onReserve={onReserve} scrollTo={scrollTo} />
      <main>
        <Hero t={t} onReserve={onReserve} scrollTo={scrollTo} lang={lang} />
        <MenuSection t={t} scrollTo={scrollTo} onReserve={onReserve} />
        <Reviews t={t} lang={lang} />
        <Reservation t={t} lang={lang} registerOpen={registerOpen} />
        <Visit t={t} lang={lang} onReserve={onReserve} />
      </main>
    </React.Fragment>);

}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
